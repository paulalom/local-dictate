name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WHISPER_CPP_VERSION: v1.8.4
  DEFAULT_WHISPER_MODEL: base.en
  WHISPER_ENGINE_RELEASE_PREFIX: whisper-engines
  WHISPER_MODEL_RELEASE: whisper-models
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
  APPIMAGETOOL_URL: https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
  APPIMAGE_RUNTIME_URL: https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64

jobs:
  prepare-model:
    name: Prepare Whisper model
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Download reusable Whisper model
        id: whisper-model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RELEASE: ${{ env.WHISPER_MODEL_RELEASE }}
          MODEL_ASSET: ggml-${{ env.DEFAULT_WHISPER_MODEL }}.bin
        run: |
          set +e
          mkdir -p .local/whisper-model-release models
          gh release download "$MODEL_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$MODEL_ASSET" \
            --dir .local/whisper-model-release
          status=$?
          set -e

          if [[ "$status" -eq 0 && -f ".local/whisper-model-release/$MODEL_ASSET" ]]; then
            cp ".local/whisper-model-release/$MODEL_ASSET" "models/$MODEL_ASSET"
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install and verify default Whisper model
        shell: pwsh
        run: |
          ./scripts/install-whisper-model.ps1 `
            -Model "${{ env.DEFAULT_WHISPER_MODEL }}"

      - name: Upload reusable Whisper model
        if: steps.whisper-model.outputs.hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RELEASE: ${{ env.WHISPER_MODEL_RELEASE }}
          MODEL_ASSET: ggml-${{ env.DEFAULT_WHISPER_MODEL }}.bin
        run: |
          test -f "models/$MODEL_ASSET"

          gh release view "$MODEL_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$MODEL_RELEASE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "Whisper ggml model assets" \
              --notes "Reusable Local Dictate ggml model assets."

          gh release upload "$MODEL_RELEASE" \
            "models/$MODEL_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    needs: prepare-model
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            binary_dir: target/release
            extension: zip
          - platform: macos-universal
            runner: macos-latest
            binary_dir: target/release-universal
            extension: zip
          - platform: linux-x64
            runner: ubuntu-22.04
            binary_dir: target/release
            extension: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Resolve release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config

      - name: Cache Rust build outputs
        uses: Swatinem/rust-cache@v2

      - name: Build Windows/Linux binaries
        if: runner.os != 'macOS'
        run: |
          cargo build --workspace --release

      - name: Install Windows whisper.cpp engine
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-whisper-assets.ps1 `
            -WhisperCppVersion "${{ env.WHISPER_CPP_VERSION }}" `
            -Model "${{ env.DEFAULT_WHISPER_MODEL }}" `
            -SkipModel

      - name: Build macOS universal binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo build --workspace --release --target x86_64-apple-darwin
          cargo build --workspace --release --target aarch64-apple-darwin

          mkdir -p target/release-universal
          lipo -create \
            -output target/release-universal/local-dictate-ui \
            target/x86_64-apple-darwin/release/local-dictate-ui \
            target/aarch64-apple-darwin/release/local-dictate-ui
          lipo -create \
            -output target/release-universal/local-dictate-cli \
            target/x86_64-apple-darwin/release/local-dictate-cli \
            target/aarch64-apple-darwin/release/local-dictate-cli

      - name: Download reusable whisper.cpp engine
        id: whisper-engine
        if: runner.os != 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RELEASE: ${{ env.WHISPER_ENGINE_RELEASE_PREFIX }}-${{ env.WHISPER_CPP_VERSION }}
          ENGINE_ASSET: whisper-cli-${{ matrix.platform }}-${{ env.WHISPER_CPP_VERSION }}.tar.gz
        run: |
          set +e
          mkdir -p .local/whisper-engine-release engines
          gh release download "$ENGINE_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$ENGINE_ASSET" \
            --dir .local/whisper-engine-release
          status=$?
          set -e

          if [[ "$status" -eq 0 && -f ".local/whisper-engine-release/$ENGINE_ASSET" ]]; then
            tar -xzf ".local/whisper-engine-release/$ENGINE_ASSET" -C engines
            chmod +x engines/whisper-cli
            engines/whisper-cli --help >/dev/null
            echo "hit=true" >> "$GITHUB_OUTPUT"
          else
            echo "hit=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build macOS/Linux whisper.cpp engine
        if: runner.os != 'Windows' && steps.whisper-engine.outputs.hit != 'true'
        shell: pwsh
        run: |
          ./scripts/build-whisper-cpp.ps1 `
            -WhisperCppVersion "${{ env.WHISPER_CPP_VERSION }}" `
            -Platform "${{ matrix.platform }}"

      - name: Upload reusable whisper.cpp engine
        if: runner.os != 'Windows' && steps.whisper-engine.outputs.hit != 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ENGINE_RELEASE: ${{ env.WHISPER_ENGINE_RELEASE_PREFIX }}-${{ env.WHISPER_CPP_VERSION }}
          ENGINE_ASSET: whisper-cli-${{ matrix.platform }}-${{ env.WHISPER_CPP_VERSION }}.tar.gz
        run: |
          test -x engines/whisper-cli
          mkdir -p .local/whisper-engine-upload
          tar -czf ".local/whisper-engine-upload/$ENGINE_ASSET" -C engines whisper-cli

          gh release view "$ENGINE_RELEASE" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$ENGINE_RELEASE" \
              --repo "$GITHUB_REPOSITORY" \
              --title "whisper.cpp $WHISPER_CPP_VERSION engines" \
              --notes "Reusable Local Dictate whisper-cli engine assets for $WHISPER_CPP_VERSION." || true

          gh release upload "$ENGINE_RELEASE" \
            ".local/whisper-engine-upload/$ENGINE_ASSET" \
            --repo "$GITHUB_REPOSITORY" \
            --clobber

      - name: Verify whisper.cpp engine
        if: runner.os != 'Windows'
        shell: bash
        run: |
          test -x engines/whisper-cli
          engines/whisper-cli --help >/dev/null

      - name: Download reusable Whisper model
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          MODEL_RELEASE: ${{ env.WHISPER_MODEL_RELEASE }}
          MODEL_ASSET: ggml-${{ env.DEFAULT_WHISPER_MODEL }}.bin
        run: |
          set +e
          mkdir -p models
          rm -f "models/$MODEL_ASSET"
          gh release download "$MODEL_RELEASE" \
            --repo "$GITHUB_REPOSITORY" \
            --pattern "$MODEL_ASSET" \
            --dir models
          status=$?
          set -e

          if [[ "$status" -ne 0 || ! -f "models/$MODEL_ASSET" ]]; then
            echo "Reusable Whisper model download failed; falling back to install-whisper-model.ps1."
          fi

      - name: Install default Whisper model
        shell: pwsh
        run: |
          ./scripts/install-whisper-model.ps1 `
            -Model "${{ env.DEFAULT_WHISPER_MODEL }}"

      - name: Package release asset
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Version "${{ steps.release.outputs.version }}" `
            -Platform "${{ matrix.platform }}" `
            -BinaryDir "${{ matrix.binary_dir }}" `
            -OutputDir dist `
            -RequireEngine `
            -RequireModel `
            -DefaultModel "${{ env.DEFAULT_WHISPER_MODEL }}"

      - name: Install Linux AppImage packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .local/bin
          curl -L "$LINUXDEPLOY_URL" -o .local/bin/linuxdeploy-x86_64.AppImage
          curl -L "$APPIMAGETOOL_URL" -o .local/bin/appimagetool-x86_64.AppImage
          curl -L "$APPIMAGE_RUNTIME_URL" -o .local/bin/runtime-x86_64
          chmod +x .local/bin/linuxdeploy-x86_64.AppImage .local/bin/appimagetool-x86_64.AppImage

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./scripts/package-linux-appimage.sh \
            --version "${{ steps.release.outputs.version }}" \
            --binary-dir "${{ matrix.binary_dir }}" \
            --output-dir dist \
            --linuxdeploy .local/bin/linuxdeploy-x86_64.AppImage \
            --appimagetool .local/bin/appimagetool-x86_64.AppImage \
            --runtime-file .local/bin/runtime-x86_64 \
            --default-model "${{ env.DEFAULT_WHISPER_MODEL }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/local-dictate-${{ steps.release.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            draft="$INPUT_DRAFT"
          else
            tag="$GITHUB_REF_NAME"
            draft="false"
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DRAFT_RELEASE: ${{ steps.release.outputs.draft }}
        run: |
          generated_body="$(
            gh api "repos/$GH_REPO/releases/generate-notes" \
              --method POST \
              -f tag_name="$RELEASE_TAG" \
              -f target_commitish="$GITHUB_SHA" \
              --jq .body || true
          )"

          if [[ -n "$generated_body" ]]; then
            inline_generated_changes="$(
              printf '%s\n' "$generated_body" |
                sed -E \
                  -e '/^[[:space:]]*$/d' \
                  -e '/^\*\*Full Changelog\*\*: /d' \
                  -e '/^#{1,6}[[:space:]]+/d'
            )"

            if [[ -z "$inline_generated_changes" ]]; then
              generated_body="$(
                printf '%s\n' "$generated_body" |
                  sed -E 's/^\*\*Full Changelog\*\*: /**Changelog**: /'
              )"
            fi
          fi

          {
            if [[ -n "$generated_body" ]]; then
              printf '%s\n\n' "$generated_body"
            fi

            cat <<'EOF' | sed \
              -e "s/{{RELEASE_VERSION}}/$RELEASE_VERSION/g" \
              -e "s/{{WHISPER_CPP_VERSION}}/$WHISPER_CPP_VERSION/g" \
              -e "s/{{DEFAULT_WHISPER_MODEL}}/$DEFAULT_WHISPER_MODEL/g"
          ## Install Locations

          Local Dictate installs per user and does not require admin privileges.

          - Windows: `%LOCALAPPDATA%\Programs\Local Dictate`
          - Windows Start Menu shortcut: `%APPDATA%\Microsoft\Windows\Start Menu\Programs\Local Dictate\Local Dictate.lnk`
          - macOS: wherever you place `Local Dictate.app`; `/Applications/Local Dictate.app` is the usual shared app location, and `~/Applications/Local Dictate.app` is the per-user app location.
          - Linux AppImage install root: `~/.local/share/local-dictate` by default, or `$XDG_DATA_HOME/local-dictate` when `XDG_DATA_HOME` is set.
          - Linux installed AppImage: `~/.local/share/local-dictate/LocalDictate.AppImage`
          - Linux FUSE-free extracted AppDir: `~/.local/share/local-dictate/AppDir`
          - Linux launcher command: `~/.local/bin/local-dictate`
          - Linux desktop entry: `~/.local/share/applications/local-dictate.desktop` by default, or `$XDG_DATA_HOME/applications/local-dictate.desktop` when `XDG_DATA_HOME` is set.

          ## Windows

          Download `local-dictate-{{RELEASE_VERSION}}-windows-x64.zip`, extract the zip, then run `Install-LocalDictate.ps1` from the extracted folder. The installer creates a per-user install, Start Menu shortcut, app icon, and shortcut description.

          To update an existing Windows install, download the new zip, extract it, and run `Install-LocalDictate.ps1` again. The installer replaces the installed app files and keeps user settings.

          Launch Local Dictate from the Start Menu after installation.

          ## macOS

          Download `local-dictate-{{RELEASE_VERSION}}-macos-universal.zip`, extract the zip, then move `Local Dictate.app` to Applications or another folder you control.

          Launch `Local Dictate.app` from Finder. If macOS blocks the first launch, open System Settings, Privacy & Security, then allow the app and launch it again.

          To update macOS, quit Local Dictate, download and extract the new zip, then replace the old `Local Dictate.app` with the new one.

          ## Linux

          Choose one of the following Linux paths.

          ### Portable AppImage

          Download `local-dictate-{{RELEASE_VERSION}}-linux-x64.AppImage`, make it executable, then run it directly. This path requires working FUSE support and does not add Local Dictate to your app launcher.

          ```bash
          chmod +x local-dictate-{{RELEASE_VERSION}}-linux-x64.AppImage
          ./local-dictate-{{RELEASE_VERSION}}-linux-x64.AppImage
          ```

          ### App Launcher Install

          Download both `local-dictate-{{RELEASE_VERSION}}-linux-x64.AppImage` and `local-dictate-{{RELEASE_VERSION}}-linux-x64.install.sh` into the same folder. Make both files executable, then run the installer.

          ```bash
          chmod +x local-dictate-{{RELEASE_VERSION}}-linux-x64.AppImage local-dictate-{{RELEASE_VERSION}}-linux-x64.install.sh
          ./local-dictate-{{RELEASE_VERSION}}-linux-x64.install.sh
          ```

          The installer creates a per-user install under `~/.local`, adds a desktop launcher, installs the app icon and metadata, and keeps using the AppImage/FUSE runtime.

          To update an existing Linux install, download the new AppImage and `.install.sh` next to each other, then run the installer again. It stops the running per-user install if needed, replaces the copied AppImage, refreshes launcher metadata, and keeps user settings.

          ### FUSE-Free Install

          Use this path if AppImage mounting is blocked or unavailable. It extracts the AppImage once, then installs the extracted AppDir into `~/.local`.

          ```bash
          chmod +x local-dictate-{{RELEASE_VERSION}}-linux-x64.AppImage
          ./local-dictate-{{RELEASE_VERSION}}-linux-x64.AppImage --appimage-extract
          ./squashfs-root/install-linux.sh --appdir ./squashfs-root
          ```

          The Linux tarball `local-dictate-{{RELEASE_VERSION}}-linux-x64.tar.gz` is also available for manual extraction and debugging; most users should use one of the AppImage paths above.

          ## Included assets

          Packages include the Local Dictate UI and CLI binaries, a bundled whisper.cpp {{WHISPER_CPP_VERSION}} `whisper-cli` engine, the default {{DEFAULT_WHISPER_MODEL}} ggml model, README, and project notices. No separate whisper.cpp or model setup is required for the default configuration.
          EOF
          } > release-notes.md

          create_args=()
          if [[ "$DRAFT_RELEASE" == "true" ]]; then
            create_args+=(--draft)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "local-dictate $RELEASE_TAG" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "local-dictate $RELEASE_TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              "${create_args[@]}"
          fi
