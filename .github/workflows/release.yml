name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to create, for example v0.1.0"
        required: true
        type: string
      draft:
        description: "Create the release as a draft"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  WHISPER_CPP_VERSION: v1.8.4
  DEFAULT_WHISPER_MODEL: base.en
  LINUXDEPLOY_URL: https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage
  APPIMAGETOOL_URL: https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage

jobs:
  build:
    name: Build ${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-x64
            runner: windows-latest
            binary_dir: target/release
            extension: zip
          - platform: macos-universal
            runner: macos-latest
            binary_dir: target/release-universal
            extension: zip
          - platform: linux-x64
            runner: ubuntu-22.04
            binary_dir: target/release
            extension: tar.gz

    steps:
      - name: Check out repository
        uses: actions/checkout@v6.0.2

      - name: Resolve release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            git \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            libxdo-dev \
            pkg-config

      - name: Test and build Windows/Linux binaries
        if: runner.os != 'macOS'
        run: |
          cargo test --workspace
          cargo build --workspace --release

      - name: Install Windows whisper.cpp engine and default model
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-whisper-assets.ps1 `
            -WhisperCppVersion "${{ env.WHISPER_CPP_VERSION }}" `
            -Model "${{ env.DEFAULT_WHISPER_MODEL }}"

      - name: Test and build macOS universal binaries
        if: runner.os == 'macOS'
        shell: bash
        run: |
          rustup target add x86_64-apple-darwin aarch64-apple-darwin
          cargo test --workspace
          cargo build --workspace --release --target x86_64-apple-darwin
          cargo build --workspace --release --target aarch64-apple-darwin

          mkdir -p target/release-universal
          lipo -create \
            -output target/release-universal/local-dictate-ui \
            target/x86_64-apple-darwin/release/local-dictate-ui \
            target/aarch64-apple-darwin/release/local-dictate-ui
          lipo -create \
            -output target/release-universal/local-dictate-cli \
            target/x86_64-apple-darwin/release/local-dictate-cli \
            target/aarch64-apple-darwin/release/local-dictate-cli

      - name: Cache whisper.cpp engine
        id: whisper-engine-cache
        if: runner.os != 'Windows'
        uses: actions/cache@v4.2.4
        with:
          path: engines/whisper-cli
          key: whisper-cpp-${{ matrix.platform }}-${{ env.WHISPER_CPP_VERSION }}

      - name: Build macOS/Linux whisper.cpp engine
        if: runner.os != 'Windows' && steps.whisper-engine-cache.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          ./scripts/build-whisper-cpp.ps1 `
            -WhisperCppVersion "${{ env.WHISPER_CPP_VERSION }}" `
            -Platform "${{ matrix.platform }}"

      - name: Verify cached whisper.cpp engine
        if: runner.os != 'Windows' && steps.whisper-engine-cache.outputs.cache-hit == 'true'
        shell: bash
        run: |
          test -x engines/whisper-cli
          engines/whisper-cli --help >/dev/null

      - name: Install default Whisper model
        if: runner.os != 'Windows'
        shell: pwsh
        run: |
          ./scripts/install-whisper-model.ps1 `
            -Model "${{ env.DEFAULT_WHISPER_MODEL }}"

      - name: Package release asset
        shell: pwsh
        run: |
          ./scripts/package-release.ps1 `
            -Version "${{ steps.release.outputs.version }}" `
            -Platform "${{ matrix.platform }}" `
            -BinaryDir "${{ matrix.binary_dir }}" `
            -OutputDir dist `
            -RequireEngine `
            -RequireModel `
            -DefaultModel "${{ env.DEFAULT_WHISPER_MODEL }}"

      - name: Install Linux AppImage packaging tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          mkdir -p .local/bin
          curl -L "$LINUXDEPLOY_URL" -o .local/bin/linuxdeploy-x86_64.AppImage
          curl -L "$APPIMAGETOOL_URL" -o .local/bin/appimagetool-x86_64.AppImage
          chmod +x .local/bin/linuxdeploy-x86_64.AppImage .local/bin/appimagetool-x86_64.AppImage

      - name: Package Linux AppImage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          bash ./scripts/package-linux-appimage.sh \
            --version "${{ steps.release.outputs.version }}" \
            --binary-dir "${{ matrix.binary_dir }}" \
            --output-dir dist \
            --linuxdeploy .local/bin/linuxdeploy-x86_64.AppImage \
            --appimagetool .local/bin/appimagetool-x86_64.AppImage \
            --default-model "${{ env.DEFAULT_WHISPER_MODEL }}"

      - name: Upload release asset
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-${{ matrix.platform }}
          path: dist/local-dictate-${{ steps.release.outputs.version }}-${{ matrix.platform }}.*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Download release assets
        uses: actions/download-artifact@v8.0.1
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Resolve release metadata
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_DRAFT: ${{ inputs.draft }}
        run: |
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$INPUT_TAG"
            draft="$INPUT_DRAFT"
          else
            tag="$GITHUB_REF_NAME"
            draft="false"
          fi

          version="${tag#v}"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "draft=$draft" >> "$GITHUB_OUTPUT"

      - name: Create or update GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          DRAFT_RELEASE: ${{ steps.release.outputs.draft }}
        run: |
          cat > release-notes.md <<EOF
          Platform packages:

          - local-dictate-$RELEASE_VERSION-windows-x64.zip
          - local-dictate-$RELEASE_VERSION-macos-universal.zip
          - local-dictate-$RELEASE_VERSION-linux-x64.tar.gz
          - local-dictate-$RELEASE_VERSION-linux-x64.AppImage

          These packages include the Local Dictate UI and CLI binaries, a bundled whisper.cpp $WHISPER_CPP_VERSION whisper-cli engine, the default $DEFAULT_WHISPER_MODEL ggml model, README, and project notices. On Windows, run Install-LocalDictate.ps1 from the extracted package to install or update the app in a stable per-user location with a Start Menu shortcut, app icon, and shortcut description. On Linux, use the AppImage for the most self-contained desktop package; the tarball is still available for manual extraction and debugging. Other packages can be extracted and run directly; no separate whisper.cpp or model setup is required for the default configuration.
          EOF

          create_args=()
          if [[ "$DRAFT_RELEASE" == "true" ]]; then
            create_args+=(--draft)
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release edit "$RELEASE_TAG" \
              --title "local-dictate $RELEASE_TAG" \
              --notes-file release-notes.md
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            gh release create "$RELEASE_TAG" dist/* \
              --title "local-dictate $RELEASE_TAG" \
              --notes-file release-notes.md \
              --target "$GITHUB_SHA" \
              "${create_args[@]}"
          fi
