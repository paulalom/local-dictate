[workspace]
members = [
    "crates/local-dictate-core",
    "crates/local-dictate-cli",
    "crates/local-dictate-ui",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT OR Apache-2.0"
description = "Local, no-network voice dictation that saves nothing."
repository = "https://github.com/paulalom/local-dictate"
